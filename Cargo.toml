[package]
name = "diff-track"
version = "0.1.0"
edition = "2021"
description = "Fast, local AI code change workbench & CLI aggregator for Antigravity, Claude Code, Codex, and Gemini CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/xzen4ever/agent-diff-tracker"
homepage = "https://github.com/xzen4ever/agent-diff-tracker"
keywords = ["diff", "ai", "cli", "egui", "code-review"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
